name: orderflow
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orderflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker}
      POSTGRES_DB: orderflow_db
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - orderflow_compose_pg:/var/lib/postgresql
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d orderflow_db"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: .
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: orderflow_db
      DB_USER: ${POSTGRES_USER:-orderflow}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.docker}
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/app/app:ro
      - ./alembic:/app/alembic:ro
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"]
  web:
    build: ./frontend
    environment:
      API_PROXY_TARGET: http://api:8000
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - api
volumes:
  orderflow_compose_pg:
